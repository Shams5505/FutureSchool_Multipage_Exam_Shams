<body>

  
  <header>

    
    <nav class="navbar container">
      <a href="index.html" class="logo"><span>F</span>Future School</a>

        <li><a href="index.html">Home</a></li>

  <main>

   
    <section id="login" class="login">

      <div class="login-box">

        <h1>Sign in</h1>
        <p class="note">Welcome back to Future School.</p>

        <form class="login-form" action="#" method="post">

          <div class="field">
            <label for="lemail">Email</label>
            <input type="email" id="lemail" name="email" required>
          </div>

          <div class="field">
            <label for="lpass">Password</label>
            <input type="password" id="lpass" name="password" required>
          </div>

          <div>
            <button type="submit" class="btn">Sign In</button>
          </div>

        </form>

        <p class="demo">This is a demo page only. No real sign in happens.</p>

        <a href="index.html" class="go">&larr; Back to home</a>

      </div>
    </section>
  </main>

  
  <footer id="bottom" class="foot">
    <div class="text-con">
      <a href="index.html" class="logo"><span>F</span>Future School</a>
      <p>&copy; 2026 Future School. Learning for a better tomorrow.</p>
    </div>
  </footer>
